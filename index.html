<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 智能助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #4f7cff;
    --accent-grad: linear-gradient(135deg, #4f7cff, #6a5cff);
    --text: #1f2329;
    --text-2: #646a73;
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e6e8ef;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(106, 92, 255, 0.10), transparent 60%),
      radial-gradient(900px 420px at 10% -10%, rgba(79, 124, 255, 0.10), transparent 60%),
      var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- 顶部 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  .logo {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    color: #fff; font-size: 16px;
    box-shadow: 0 4px 12px rgba(79, 124, 255, 0.35);
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  header .badge {
    font-size: 11px; color: var(--accent);
    background: rgba(79, 124, 255, 0.10);
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid rgba(79, 124, 255, 0.25);
  }
  .status { position: absolute; right: 24px; font-size: 12px; color: var(--text-2); }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fbf71; margin-right: 6px; }
  .status .dot.off { background: #c9cdd4; }

  /* ---------- 输出区 ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px 8px;
    scroll-behavior: smooth;
  }
  .chat {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 12px;
  }

  /* 空态引导 */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 40px 0 20px;
  }
  .empty .big-icon {
    width: 72px; height: 72px;
    border-radius: 24px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    font-size: 36px; color: #fff;
    box-shadow: 0 12px 32px rgba(79, 124, 255, 0.35);
  }
  .empty h2 { font-size: 22px; font-weight: 600; }
  .empty p { color: var(--text-2); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
  .chips button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-2);
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .chips button:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,124,255,.12); }

  /* 对话气泡 */
  .turn { display: flex; gap: 12px; }
  .turn.user { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 16px;
    margin-top: 2px;
  }
  .turn.ai .avatar { background: var(--accent-grad); color: #fff; }
  .turn.user .avatar { background: #eef1f6; color: #3a4b57; }
  .bubble {
    max-width: calc(100% - 46px);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.75;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .turn.user .bubble {
    background: var(--accent-grad);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .turn.ai .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    box-shadow: 0 2px 10px rgba(31, 35, 41, 0.04);
  }
  .bubble p { margin: 0 0 8px; white-space: pre-wrap; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 6px; line-height: 1.4; }
  .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 16px; } .bubble h4 { font-size: 15px; }
  .bubble ul { padding-left: 20px; margin: 4px 0 8px; }
  .bubble li { margin: 2px 0; }
  .bubble code {
    background: rgba(79, 124, 255, 0.08);
    color: #4f5bd5;
    padding: 1px 6px;
    border-radius: 5px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 13px;
  }
  .bubble pre {
    background: #1f2329;
    color: #e6e8ef;
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble pre code { background: transparent; color: inherit; padding: 0; font-size: 13px; }
  .cursor {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 0.9s steps(2) infinite;
  }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

  /* 来源引用 */
  .sources {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .source-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px;
    color: var(--accent);
    background: rgba(79, 124, 255, 0.08);
    border: 1px solid rgba(79, 124, 255, 0.22);
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
  }
  .source-pill:hover { background: rgba(79, 124, 255, 0.16); }
  .source-panel {
    margin-top: 8px;
    background: #fafbfd;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-2);
  }
  .source-panel .src-item { margin-bottom: 8px; }
  .source-panel .src-item:last-child { margin-bottom: 0; }
  .source-panel .src-head { font-weight: 600; color: var(--text); font-size: 12px; margin-bottom: 2px; }

  /* ---------- 输入区 ---------- */
  .input-wrap {
    flex-shrink: 0;
    padding: 8px 20px 20px;
  }
  .input-bar {
    max-width: 820px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 8px 10px 8px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    box-shadow: 0 6px 24px rgba(31, 35, 41, 0.06);
    transition: border-color .15s, box-shadow .15s;
  }
  .input-bar:focus-within { border-color: var(--accent); box-shadow: 0 6px 28px rgba(79, 124, 255, 0.14); }
  textarea {
    flex: 1;
    border: none; outline: none; resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    background: transparent;
    max-height: 120px;
    padding: 6px 0;
  }
  textarea::placeholder { color: #9aa0a8; }
  #sendBtn {
    width: 40px; height: 40px;
    border: none; border-radius: 12px;
    background: var(--accent-grad);
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: transform .12s, opacity .12s;
    box-shadow: 0 4px 12px rgba(79, 124, 255, 0.3);
  }
  #sendBtn:hover { transform: translateY(-1px); }
  #sendBtn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  #sendBtn.stop { background: #e5484d; box-shadow: 0 4px 12px rgba(229, 72, 77, .3); }
  .hint { text-align: center; font-size: 11px; color: #9aa0a8; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">AI</div>
  <h1>AI 智能助手</h1>
  <span class="badge">知识库 RAG · 流式输出</span>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中</span></div>
</header>

<main id="main">
  <div class="chat" id="chat">
    <!-- 空态引导 -->
    <div class="empty" id="empty">
      <div class="big-icon">✦</div>
      <h2>你好，我是你的 AI 助手</h2>
      <p>基于知识库检索回答，支持流式输出，试试下面的问题</p>
      <div class="chips">
        <button data-q="财富自由的核心是什么？">财富自由的核心是什么？</button>
        <button data-q="如何构建被动收入？">如何构建被动收入？</button>
        <button data-q="普通人积累本金有哪些方法？">普通人积累本金有哪些方法？</button>
      </div>
    </div>
  </div>
</main>

<div class="input-wrap">
  <div class="input-bar">
    <textarea id="input" rows="1" placeholder="向 AI 助手提问，回车发送，Shift+Enter 换行"></textarea>
    <button id="sendBtn" title="发送">
      <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <svg id="stopIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
  </div>
  <div class="hint">内容由 AI 生成，仅供参考 · demo6 · FastAPI + Chroma + 本地 BGE + 通义千问</div>
</div>

<script>
const chatEl = document.getElementById('chat');
const emptyEl = document.getElementById('empty');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sendIcon = document.getElementById('sendIcon');
const stopIcon = document.getElementById('stopIcon');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let controller = null;          // 当前请求的 AbortController
let currentTurn = null;         // 正在渲染的 AI 回答气泡
let currentCursor = null;       // 流式光标元素

/* ---------------- 工具函数 ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/** 极简 markdown 渲染：代码块/行内代码/加粗/标题/列表/段落 */
function renderMarkdown(text) {
  let html = escapeHtml(text);
  // 代码块
  html = html.replace(/```(\w*)[\n\r]*([\s\S]*?)```/g, (m, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
  // 行内代码
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // 加粗
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  // 按空行切块
  return html.split(/\n{2,}/).map(block => {
    const b = block.trim();
    if (!b) return '';
    if (/^#{1,3} /.test(b)) {                      // 标题
      const level = b.indexOf(' ');
      const tag = { 1: 'h2', 2: 'h3', 3: 'h4' }[level];
      return `<${tag}>${b.slice(level + 1)}</${tag}>`;
    }
    const lines = b.split('\n');
    if (lines.every(l => /^[-*] /.test(l))) {      // 无序列表
      return `<ul>${lines.map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('')}</ul>`;
    }
    if (lines.every(l => /^\d+[.、] /.test(l))) {  // 有序列表
      return `<ul style="list-style:decimal">${lines.map(l => `<li>${l.replace(/^\d+[.、] /, '')}</li>`).join('')}</ul>`;
    }
    return `<p>${b.replace(/\n/g, '<br>')}</p>`;   // 普通段落
  }).join('');
}

function scrollBottom() {
  const main = document.getElementById('main');
  main.scrollTop = main.scrollHeight;
}

function setOnline(ok) {
  statusDot.classList.toggle('off', !ok);
  statusText.textContent = ok ? '服务在线' : '服务离线';
}

/* ---------------- 界面元素 ---------------- */
function addUserBubble(text) {
  const turn = document.createElement('div');
  turn.className = 'turn user';
  turn.innerHTML = `<div class="avatar">我</div><div class="bubble"></div>`;
  turn.querySelector('.bubble').textContent = text;
  chatEl.appendChild(turn);
}

function addAiBubble() {
  const turn = document.createElement('div');
  turn.className = 'turn ai';
  turn.innerHTML = `<div class="avatar">AI</div><div class="bubble"></div>`;
  chatEl.appendChild(turn);
  return turn.querySelector('.bubble');
}

function addSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const row = document.createElement('div');
  row.className = 'sources';
  const toggle = document.createElement('span');
  toggle.className = 'source-pill';
  toggle.textContent = `📄 参考 ${sources.length} 篇文档`;
  const panel = document.createElement('div');
  panel.style.display = 'none';
  panel.className = 'source-panel';
  panel.innerHTML = sources.map(s =>
    `<div class="src-item"><div class="src-head">${s.source} · 相似度 ${s.score}</div><div>${escapeHtml(s.text)}</div></div>`
  ).join('');
  toggle.onclick = () => { panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; };
  row.appendChild(toggle);
  row.appendChild(panel);
  bubble.appendChild(row);
}

/* ---------------- SSE 流式解析 ---------------- */
async function send() {
  const query = inputEl.value.trim();
  if (!query) return;

  // 隐藏空态，添加用户气泡
  emptyEl.style.display = 'none';
  addUserBubble(query);
  inputEl.value = '';
  autoGrow();
  scrollBottom();

  // 准备 AI 气泡
  currentTurn = addAiBubble();
  currentCursor = document.createElement('span');
  currentCursor.className = 'cursor';
  currentTurn.appendChild(currentCursor);

  // 切换到“停止”状态
  controller = new AbortController();
  setSending(true);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 3 }),
      signal: controller.signal,
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    if (!resp.body) throw new Error('浏览器不支持流式响应');

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // SSE 事件以空行分隔
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) handleEvent(part);
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      appendAnswer('\n\n（已停止生成）');
    } else {
      appendAnswer(`\n\n⚠️ 请求出错：${err.message}`);
    }
  } finally {
    setSending(false);
    if (currentCursor) { currentCursor.remove(); currentCursor = null; }
    currentTurn = null;
  }
}

function handleEvent(part) {
  let event = 'message', data = '';
  for (const line of part.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return;
  let obj; try { obj = JSON.parse(data); } catch { return; }

  if (event === 'source') {
    addSources(currentTurn, obj.sources);
    scrollBottom();
  } else if (event === 'token') {
    appendAnswer(obj.text);
  } else if (event === 'done') {
    // 结束：可选的后续处理
  } else if (event === 'error') {
    appendAnswer(`\n\n⚠️ ${obj.message || '未知错误'}`);
  }
}

/** 把文本追加到当前 AI 气泡（光标保持在末尾） */
function appendAnswer(text) {
  if (!currentTurn) return;
  if (currentCursor) currentCursor.remove();
  currentTurn.insertAdjacentText('beforeend', text);
  if (currentCursor) currentTurn.appendChild(currentCursor);
  scrollBottom();
}

function setSending(sending) {
  sendBtn.disabled = false;
  if (sending) {
    sendBtn.classList.add('stop');
    sendIcon.style.display = 'none';
    stopIcon.style.display = 'block';
  } else {
    sendBtn.classList.remove('stop');
    sendIcon.style.display = 'block';
    stopIcon.style.display = 'none';
  }
}

/* ---------------- 输入框 ---------------- */
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

sendBtn.onclick = () => {
  if (sendBtn.classList.contains('stop')) {   // 停止生成
    if (controller) controller.abort();
    return;
  }
  send();
};

inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

// 空态建议词一键填入并发送
document.querySelectorAll('.chips button').forEach(btn => {
  btn.onclick = () => {
    inputEl.value = btn.dataset.q;
    autoGrow();
    send();
  };
});

/* ---------------- 启动：健康检查 ---------------- */
async function checkHealth() {
  try {
    const resp = await fetch('/api/health');
    setOnline(resp.ok);
  } catch { setOnline(false); }
}
checkHealth();
</script>
</body>
</html>
